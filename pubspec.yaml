name: flutter_template
description: "A production-ready, feature-first Flutter base template."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # Routing
  go_router: ^18.1.3

  # Local Database
  drift: ^2.31.0
  drift_flutter: ^0.2.8

  # Networking
  dio: ^5.11.1

  # Serialization & Immutability
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Storage & Environment
  flutter_dotenv: ^6.0.1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6

  # Network Connectivity
  connectivity_plus: ^7.3.2

  # Splash (used at runtime by bootstrap / SplashGuard)
  flutter_native_splash: ^2.4.8

  # Localization & Utilities
  intl: any
  google_fonts: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.15.1
  riverpod_generator: ^4.0.0+1
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  drift_dev: ^2.31.0

  # Linting & Analysis
  flutter_lints: ^6.0.0
  riverpod_lint: ^3.1.0

  # Launcher icon generator (dart run flutter_launcher_icons)
  flutter_launcher_icons: ^0.14.4

  # Testing
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
  default-flavor: dev

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/animations/
    # Per-flavor assets: a build only bundles its own .env file.
    - path: .env.dev
      flavors:
        - dev
    - path: .env.staging
      flavors:
        - staging
    - path: .env.prod
      flavors:
        - prod
