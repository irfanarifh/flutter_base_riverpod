name: flutter_template
description: "A production-ready, feature-first Flutter base template."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Local Database
  drift: ^2.26.0
  drift_flutter: ^0.2.4

  # Networking
  dio: ^5.8.0+1

  # Serialization & Immutability
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Storage & Environment
  flutter_dotenv: ^5.2.1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3

  # Network Connectivity
  connectivity_plus: ^6.1.3

  # UI, Splash & Launcher
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

  # Localization & Utilities
  intl: ^0.20.2
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.4
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  drift_dev: ^2.26.0

  # Linting & Analysis
  flutter_lints: ^5.0.0
  custom_lint: ^0.7.3
  riverpod_lint: ^2.6.4

  # Testing
  mocktail: ^1.0.4

dependency_overrides:
  analyzer_plugin: ^0.13.0

flutter:
  uses-material-design: true
  generate: true
  default-flavor: dev

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/animations/
    - .env.dev
    - .env.staging
    - .env.prod
